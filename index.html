<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>費用分攤達人 v1.3.1</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen py-8 px-4 font-sans">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- 頂部 Header 與 工具列 -->
    <header class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <div class="flex items-center gap-2.5">
          <h1 class="text-2xl font-bold text-indigo-700 flex items-center gap-2">
            <span>🧾</span> 費用分攤達人
          </h1>
          <span class="px-2 py-0.5 text-xs font-semibold bg-indigo-100 text-indigo-800 rounded-md">v1.3.1</span>
        </div>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <button id="btnUndo" onclick="undo()" disabled class="px-3 py-1.5 text-xs font-medium rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed transition flex items-center gap-1">
          <span>↩</span> 復原
        </button>
        <button id="btnRedo" onclick="redo()" disabled class="px-3 py-1.5 text-xs font-medium rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed transition flex items-center gap-1">
          <span>↪</span> 重做
        </button>
        <button onclick="clearAllData()" class="px-3 py-1.5 text-xs bg-rose-50 text-rose-600 hover:bg-rose-100 font-medium rounded-lg transition ml-1">
          清空所有資料
        </button>
      </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- 成員清單管理 -->
      <section class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-4 md:col-span-1 h-fit">
        <div class="flex justify-between items-center">
          <h2 class="text-base font-semibold text-slate-800 flex items-center gap-2">
            <span>👥</span> 出遊夥伴
          </h2>
          <span class="text-xs text-slate-400" id="memberCountLabel">0 人</span>
        </div>
        <div class="flex gap-2">
          <input id="newMemberInput" type="text" placeholder="輸入姓名按新增" class="flex-1 px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" onkeydown="if(event.key==='Enter') addMember()">
          <button onclick="addMember()" class="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg transition">新增</button>
        </div>
        <div id="membersList" class="flex flex-wrap gap-2 pt-1">
          <!-- 成員標籤 -->
        </div>
      </section>

      <!-- 新增消費支出記錄 -->
      <section class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-5 md:col-span-2">
        <h2 class="text-base font-semibold text-slate-800 flex items-center gap-2">
          <span>➕</span> 記錄款項
        </h2>

        <!-- 消費項目與代墊人 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">消費或活動名稱</label>
            <input id="itemDesc" type="text" placeholder="例：週六海鮮餐廳晚餐、麻將" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-
