<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>費用分攤達人 v1.3.2</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen py-8 px-4 font-sans">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- 頂部 Header -->
    <header class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div class="flex items-center gap-2.5">
        <h1 class="text-2xl font-bold text-indigo-700 flex items-center gap-2">
          <span>🧾</span> 費用分攤達人
        </h1>
        <span class="px-2 py-0.5 text-xs font-semibold bg-indigo-100 text-indigo-800 rounded-md">v1.3.2</span>
      </div>
      <div class="flex items-center gap-2">
        <button id="btnUndo" onclick="undo()" disabled class="px-3 py-1.5 text-xs font-medium rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed transition">↩ 復原</button>
        <button id="btnRedo" onclick="redo()" disabled class="px-3 py-1.5 text-xs font-medium rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed transition">↪ 重做</button>
        <button onclick="clearAllData()" class="px-3 py-1.5 text-xs bg-rose-50 text-rose-600 hover:bg-rose-100 font-medium rounded-lg transition ml-1">清空所有資料</button>
      </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <!-- 成員管理 -->
      <section class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-4 md:col-span-1 h-fit">
        <div class="flex justify-between items-center">
          <h2 class="text-base font-semibold text-slate-800 flex items-center gap-2"><span>👥</span> 出遊夥伴</h2>
          <span class="text-xs text-slate-400" id="memberCountLabel">0 人</span>
        </div>
        <div class="flex gap-2">
          <input id="newMemberInput" type="text" placeholder="輸入姓名按新增" class="flex-1 px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" onkeydown="if(event.key==='Enter') addMember()">
          <button onclick="addMember()" class="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg transition">新增</button>
        </div>
        <div id="membersList" class="flex flex-wrap gap-2 pt-1"></div>
      </section>

      <!-- 記錄款項 -->
      <section class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-5 md:col-span-2">
        <h2 class="text-base font-semibold text-slate-800 flex items-center gap-2"><span>➕</span> 記錄款項</h2>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">消費或活動名稱</label>
            <input id="itemDesc" type="text" placeholder="例：週六海鮮餐廳晚餐、麻將" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1" id="payerLabel">誰先代墊付款？</label>
            <select id="itemPayer" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
              <option value="">無成員</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-2">分攤模式</label>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
            <button type="button" id="modeBtn-equal" onclick="setSplitMode('equal')" class="py-2 text-xs font-semibold rounded-lg border border-indigo-600 bg-indigo-600 text-white transition">1. 平攤</button>
            <button type="button" id="modeBtn-percent" onclick="setSplitMode('percent')" class="py-2 text-xs font-semibold rounded-lg border border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100 transition">2. 百分比 %</button>
            <button type="button" id="modeBtn-items" onclick="setSplitMode('items')" class="py-2 text-xs font-semibold rounded-lg border border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100 transition">3. 指定品項+稅</button>
            <button type="button" id="modeBtn-mahjong" onclick="setSplitMode('mahjong')" class="py-2 text-xs font-semibold rounded-lg border border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100 transition">4. 🀄 麻將結算</button>
          </div>
        </div>

        <div id="generalAmountSection" class="p-4 rounded-xl border border-slate-200 bg-slate-50/50 space-y-3">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">發票總金額 (含稅)</label>
              <input id="itemAmount" type="number" min="0" step="any" placeholder="0" oninput="handleAmountChange()" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
            </div>
            <div id="taxFieldWrapper" class="hidden">
              <label class="block text-xs font-semibold text-slate-600 mb-1">稅額 / 服務費 (固定金額)</label>
              <input id="itemTax" type="number" min="0" step="any" placeholder="0" oninput="handleAmountChange()" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
            </div>
          </div>
          <div id="taxSummaryNotice" class="text-xs text-indigo-600 font-medium hidden"></div>
        </div>

        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
          <div class="flex justify-between items-center">
            <span class="text-xs font-semibold text-slate-600" id="splitModeDesc">分配明細設定</span>
            <span id="validationNotice" class="text-xs font-medium"></span>
          </div>
          <div id="splitConfigContainer" class="space-y-3"></div>
        </div>

        <button id="submitExpenseBtn" onclick="saveExpense()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl transition shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">確認儲存此筆費用</button>
      </section>
    </div>

    <!-- 支出清單 -->
    <section class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-base font-semibold text-slate-800 flex items-center gap-2"><span>📋</span> 支出明細記錄 (<span id="expenseCount">0</span> 筆)</h2>
        <span class="text-sm font-semibold text-slate-600">累計總支出: <span id="totalExpenseAmount">0</span></span>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-100 text-slate-600 text-xs">
            <tr>
              <th class="p-3 rounded-l-lg">項目</th>
              <th class="p-3">代墊/付款人</th>
              <th class="p-3">總額</th>
              <th class="p-3">模式與分攤明細</th>
              <th class="p-3 text-right rounded-r-lg">操作</th>
            </tr>
          </thead>
          <tbody id="expenseTableBody" class="divide-y divide-slate-100 text-slate-700"></tbody>
        </table>
      </div>
    </section>

    <!-- 匯款方案 -->
    <section class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-6">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div><h2 class="text-lg font-bold text-emerald-700 flex items-center gap-2"><span>🎉</span> 匯款方案</h2></div>
        <button onclick="copySettlementReport()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium rounded-xl transition shadow-sm flex items-center gap-1.5"><span>📋</span> 一鍵複製 LINE 結算訊息</button>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-slate-50 rounded-xl p-4 border border-slate-200 space-y-3">
          <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider">每人收支淨額 (+應收 / -應付)</h3>
          <div id="netBalanceList" class="space-y-2"></div>
        </div>
        <div class="bg-emerald-50/50 rounded-xl p-4 border border-emerald-200 space-y-3">
          <h3 class="text-xs font-bold text-emerald-800 uppercase tracking-wider">轉帳指示</h3>
          <div id="transferInstructions" class="space-y-2.5"></div>
        </div>
      </div>
    </section>

  </div>

  <script>
    let state = { members: [], splitMode: 'equal', expenses: [] };
    let undoStack = [], redoStack = [];
    let currentItems = [{ id: 1, name: '餐點 A', price: '', assigned: [] }];
    let percentShares = {};
    let mahjongState = { tableFee: 0, feeSplitMode: 'all', scores: {} };

    function saveSnapshot() {
      undoStack.push(JSON.stringify(state));
      redoStack = [];
      if (undoStack.length > 50) undoStack.shift();
      updateUndoRedoButtons();
      saveToStorage();
    }

    function undo() {
      if (undoStack.length === 0) return;
      redoStack.push(JSON.stringify(state));
      state = JSON.parse(undoStack.pop());
      updateUndoRedoButtons();
      saveToStorage();
      renderAll();
    }

    function redo() {
      if (redoStack.length === 0) return;
      undoStack.push(JSON.stringify(state));
      state = JSON.parse(redoStack.pop());
      updateUndoRedoButtons();
      saveToStorage();
      renderAll();
    }

    function updateUndoRedoButtons() {
      const u = document.getElementById('btnUndo'), r = document.getElementById('btnRedo');
      if (u) u.disabled = undoStack.length === 0;
      if (r) r.disabled = redoStack.length === 0;
    }

    function loadSavedState() {
      const saved = localStorage.getItem('bill_expert_state_v132');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed.members)) state.members = parsed.members;
          if (parsed.splitMode) state.splitMode = parsed.splitMode;
          if (Array.isArray(parsed.expenses)) state.expenses = parsed.expenses;
        } catch(e) {}
      }
      renderAll();
    }

    function saveToStorage() {
      localStorage.setItem('bill_expert_state_v132', JSON.stringify(state));
    }

    function addMember() {
      const input = document.getElementById('newMemberInput');
      const name = input ? input.value.trim() : '';
      if (!name) return;
      if (state.members.includes(name)) { alert('成員已存在！'); return; }
      saveSnapshot();
      state.members.push(name);
      if (input) input.value = '';
      renderAll();
    }

    function removeMember(name) {
      if (!confirm(`確定要移除「${name}」嗎？`)) return;
      saveSnapshot();
      state.members = state.members.filter(m => m !== name);
      delete percentShares[name];
      delete mahjongState.scores[name];
      currentItems.forEach(item => { item.assigned = item.assigned.filter(m => m !== name); });
      renderAll();
    }

    function setSplitMode(mode) {
      state.splitMode = mode;
      ['equal', 'percent', 'items', 'mahjong'].forEach(m => {
        const btn = document.getElementById(`modeBtn-${m}`);
        if (!btn) return;
        btn.className = (m === mode) 
          ? "py-2 text-xs font-semibold rounded-lg border border-indigo-600 bg-indigo-600 text-white transition"
          : "py-2 text-xs font-semibold rounded-lg border border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100 transition";
      });

      const gen = document.getElementById('generalAmountSection');
      const taxF = document.getElementById('taxFieldWrapper');
      const pLab = document.getElementById('payerLabel');

      if (gen && taxF && pLab) {
        if (mode === 'mahjong') {
          gen.classList.add('hidden');
          pLab.textContent = '檯費代墊人 (若無檯費選任一人)';
        } else {
          gen.classList.remove('hidden');
          pLab.textContent = '誰先代墊付款？';
          if (mode === 'items') {
            taxF.classList.remove('hidden');
          } else {
            taxF.classList.add('hidden');
            const ti = document.getElementById('itemTax');
            if (ti) ti.value = '';
          }
        }
      }
      renderSplitConfig();
      handleAmountChange();
    }

    function handleAmountChange() {
      const amtInput = document.getElementById('itemAmount');
      const taxInput = document.getElementById('itemTax');
      const notice = document.getElementById('taxSummaryNotice');
      const total = amtInput ? (parseFloat(amtInput.value) || 0) : 0;
      const tax = taxInput ? (parseFloat(taxInput.value) || 0) : 0;

      if (notice) {
        if (state.splitMode === 'items' && total > 0) {
          if (tax > 0) {
            const preTax = total - tax;
            if (preTax > 0) {
              notice.innerHTML = `💡 稅前總額: <b>${preTax.toFixed(1)}</b> ｜ 實質稅率/服務費率: <b>${((tax / preTax) * 100).toFixed(2)}%</b>`;
              notice.classList.remove('hidden');
            } else {
              notice.innerHTML = `⚠️ 稅額不可大於或等於總額`;
              notice.classList.remove('hidden');
            }
          } else {
            notice.innerHTML = `💡 目前未輸入稅額（以全額計算）`;
            notice.classList.remove('hidden');
          }
        } else {
          notice.classList.add('hidden');
        }
      }
      validateSplits();
    }

    function renderSplitConfig() {
      const container = document.getElementById('splitConfigContainer');
      const desc = document.getElementById('splitModeDesc');
      if (!container || !desc) return;
      container.innerHTML = '';

      if (state.members.length === 0) {
        desc.textContent = '請先在左側新增成員';
        container.innerHTML = `<div class="p-3 text-center text-xs text-slate-400">目前尚無成員，請先新增夥伴</div>`;
        validateSplits();
        return;
      }

      if (state.splitMode === 'equal') {
        desc.textContent = '勾選共同平攤成員：';
        const grid = document.createElement('div');
        grid.className = 'grid grid-cols-2 sm:grid-cols-3 gap-2';
        state.members.forEach(m => {
          const l = document.createElement('label');
          l.className = 'flex items-center gap-2 p-2 bg-white rounded-lg border border-slate-200 cursor-pointer hover:bg-slate-50 text-sm';
          l.innerHTML = `<input type="checkbox" name="equalMember" value="${m}" checked onchange="validateSplits()" class="w-4 h-4 text-indigo-600 rounded"><span class="truncate">${m}</span>`;
          grid.appendChild(l);
        });
        container.appendChild(grid);
      } else if (state.splitMode === 'percent') {
        desc.textContent = '輸入每人負擔比例 (%)：';
        const amtInput = document.getElementById('itemAmount');
        const total = amtInput ? (parseFloat(amtInput.value) || 0) : 0;
        state.members.forEach(m => {
          const val = percentShares[m] !== undefined ? percentShares[m] : '';
          const est = val ? ((total * parseFloat(val)) / 100).toFixed(1) : '0';
          const r = document.createElement('div');
          r.className = 'flex items-center justify-between gap-3 p-2 bg-white rounded-lg border border-slate-200';
          r.innerHTML = `
            <span class="text-sm font-medium text-slate-700 w-28 truncate">${m}</span>
            <div class="flex items-center gap-2">
              <span class="text-xs text-slate-400">約 ${est}</span>
              <div class="flex items-center gap-1 w-24">
                <input type="number" min="0" max="100" step="any" placeholder="0" value="${val}" oninput="percentShares['${m}']=this.value; handleAmountChange();" class="w-full px-2 py-1 text-sm border border-slate-300 rounded text-right focus:outline-none focus:ring-1 focus:ring-indigo-500">
                <span class="text-xs text-slate-500">%</span>
              </div>
            </div>`;
          container.appendChild(r);
        });
      } else if (state.splitMode === 'items') {
        desc.textContent = '輸入各品項稅前單價並指定承擔人：';
        renderItemsUI(container);
      } else if (state.splitMode === 'mahjong') {
        desc.textContent = '🀄 輸入雀友輸贏總額 (贏正、輸負)：';
        renderMahjongUI(container);
      }
      validateSplits();
    }

    function renderItemsUI(container) {
      const itemsList = document.createElement('div');
      itemsList.className = 'space-y-3';
      currentItems.forEach((item, index) => {
        const itemCard = document.createElement('div');
        itemCard.className = 'p-3 bg-white rounded-xl border border-slate-200 shadow-xs space-y-2';
        const isAllSelected = state.members.length > 0 && item.assigned.length === state.members.length;
        itemCard.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-slate-400">#${index + 1}</span>
            <input type="text" placeholder="品項名稱" value="${item.name}" oninput="currentItems[${index}].name=this.value;" class="flex-1 px-2.5 py-1 text-sm border border-slate-300 rounded focus:outline-none focus:ring-1 focus:ring-indigo-500">
            <div class="flex items-center gap-1 w-32">
              <span class="text-xs text-slate-400">稅前</span>
              <input type="number" min="0" step="any" placeholder="0" value="${item.price}" oninput="currentItems[${index}].price=this.value; validateSplits();" class="w-full px-2 py-1 text-sm border border-slate-300 rounded text-right focus:outline-none focus:ring-1 focus:ring-indigo-500">
            </div>
            <button onclick="removeItem(${index})" class="text-slate-400 hover:text-rose-500 text-sm px-1 font-bold">&times;</button>
          </div>
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-[11px] font-semibold text-slate-500">此項由誰承擔：</span>
              <button type="button" onclick="toggleSelectAllItem(${index})" class="text-[11px] px-2 py-0.5 rounded font-medium transition ${isAllSelected ? 'bg-amber-100 text-amber-800 hover:bg-amber-200' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                ${isAllSelected ? '✖ 全清' : '✔ 全選'}
              </button>
            </div>
            <div class="flex flex-wrap gap-1.5">
              ${state.members.map(m => {
                const checked = item.assigned.includes(m);
                return `<button type="button" onclick="toggleItemAssignee(${index}, '${m}')" class="px-2.5 py-1 text-xs rounded-lg border transition ${checked ? 'bg-indigo-600 text-white border-indigo-600 font-medium' : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'}">${checked ? '✓ ' : ''}${m}</button>`;
              }).join('')}
            </div>
          </div>`;
        itemsList.appendChild(itemCard);
      });
      container.appendChild(itemsList);
      const addBtn = document.createElement('button');
      addBtn.type = 'button';
      addBtn.onclick = addItem;
      addBtn.className = 'w-full py-1.5 border border-dashed border-indigo-300 hover:border-indigo-500 text-indigo-600 text-xs font-semibold rounded-lg transition';
      addBtn.textContent = '+ 新增品項';
      container.appendChild(addBtn);
    }

    function addItem() {
      currentItems.push({ id: Date.now(), name: `品項 ${String.fromCharCode(65 + currentItems.length)}`, price: '', assigned: [] });
      renderSplitConfig();
    }
    function removeItem(idx) {
      if (currentItems.length <= 1) return alert('至少需保留 1 個品項');
      currentItems.splice(idx, 1);
      renderSplitConfig();
    }
    function toggleItemAssignee(itemIdx, member) {
      const arr = currentItems[itemIdx].assigned;
      const pos = arr.indexOf(member);
      if (pos > -1) arr.splice(pos, 1);
      else arr.push(member);
      renderSplitConfig();
    }
    function toggleSelectAllItem(itemIdx) {
      const item = currentItems[itemIdx];
      item.assigned = (item.assigned.length === state.members.length) ? [] : [...state.members];
      renderSplitConfig();
    }

    function renderMahjongUI(container) {
      const wrap = document.createElement('div');
      wrap.className = 'space-y-4';
      wrap.innerHTML = `
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 p-3 bg-white rounded-xl border border-slate-200">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">場地/檯費總額</label>
            <input type="number" min="0" step="any" placeholder="0" value="${mahjongState.tableFee || ''}" oninput="mahjongState.tableFee = parseFloat(this.value)||0; validateSplits();" class="w-full px-2.5 py-1.5 text-sm border border-slate-300 rounded focus:outline-none focus:ring-1 focus:ring-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">檯費分攤方式</label>
            <select onchange="mahjongState.feeSplitMode = this.value; validateSplits();" class="w-full px-2.5 py-1.5 text-sm border border-slate-300 rounded bg-white focus:outline-none focus:ring-1 focus:ring-indigo-500">
              <option value="all" ${mahjongState.feeSplitMode==='all'?'selected':''}>全體雀友平攤</option>
              <option value="winner" ${mahjongState.feeSplitMode==='winner'?'selected':''}>大贏家全包</option>
              <option value="none" ${mahjongState.feeSplitMode==='none'?'selected':''}>不扣檯費 (0)</option>
            </select>
          </div>
        </div>
        <div class="space-y-2">
          <span class="text-xs font-semibold text-slate-600">各人輸贏結算 (正數為贏，負數為輸)：</span>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            ${state.members.map(m => {
              const val = mahjongState.scores[m] !== undefined ? mahjongState.scores[m] : '';
              return `
                <div class="flex items-center justify-between p-2 bg-white rounded-lg border border-slate-200">
                  <span class="text-sm font-medium text-slate-700 truncate w-24">${m}</span>
                  <div class="flex items-center gap-1 w-32">
                    <input type="number" step="any" placeholder="0" value="${val}" oninput="mahjongState.scores['${m}'] = this.value; validateSplits();" class="w-full px-2 py-1 text-sm border border-slate-300 rounded text-right focus:outline-none focus:ring-1 focus:ring-indigo-500">
                  </div>
                </div>`;
            }).join('')}
          </div>
        </div>`;
      container.appendChild(wrap);
    }

    function validateSplits() {
      const notice = document.getElementById('validationNotice');
      const submitBtn = document.getElementById('submitExpenseBtn');
      if (!notice || !submitBtn) return false;

      if (state.members.length === 0) {
        notice.textContent = '❌ 請先新增成員';
        notice.className = 'text-xs font-medium text-rose-600';
        submitBtn.disabled = true;
        return false;
      }

      if (state.splitMode === 'mahjong') {
        let sum = 0, count = 0;
        state.members.forEach(m => {
          if (mahjongState.scores[m] !== undefined && mahjongState.scores[m] !== '') {
            sum += parseFloat(mahjongState.scores[m]) || 0;
            count++;
          }
        });
        if (count === 0) {
          notice.textContent = '⚠️ 請輸入雀友的輸贏金額';
          notice.className = 'text-xs font-medium text-amber-600';
          submitBtn.disabled = true;
          return false;
        }
        const diff = Math.round(sum * 100) / 100;
        if (Math.abs(diff) > 0.05) {
          notice.textContent = `❌ 輸贏未平衡，差額: ${diff > 0 ? '+' : ''}${diff}`;
          notice.className = 'text-xs font-medium text-rose-600';
          submitBtn.disabled = true;
          return false;
        } else {
          notice.textContent = '✅ 輸贏已平衡 (淨和 0)';
          notice.className = 'text-xs font-medium text-emerald-600';
          submitBtn.disabled = false;
          return true;
        }
      }

      const totalAmt = parseFloat(document.getElementById('itemAmount')?.value) || 0;
      const taxAmt = parseFloat(document.getElementById('itemTax')?.value) || 0;

      if (totalAmt <= 0) {
        notice.textContent = '⚠️ 請輸入大於 0 的金額';
        notice.className = 'text-xs font-medium text-amber-600';
        submitBtn.disabled = true;
        return false;
      }

      if (state.splitMode === 'equal') {
        const checked = Array.from(document.querySelectorAll('input[name="equalMember"]:checked'));
        if (checked.length === 0) {
          notice.textContent = '⚠️ 至少需選擇 1 人分攤';
          notice.className = 'text-xs font-medium text-rose-600';
          submitBtn.disabled = true;
          return false;
        }
        notice.textContent = `每人約 ${(totalAmt / checked.length).toFixed(1)} (${checked.length} 人)`;
        notice.className = 'text-xs font-medium text-emerald-600';
      } else if (state.splitMode === 'percent') {
        let totalPct = 0;
        state.members.forEach(m => { totalPct += parseFloat(percentShares[m]) || 0; });
        const diff = Math.round((100 - totalPct) * 100) / 100;
        if (Math.abs(diff) > 0.05) {
          notice.textContent = `❌ 比例目前 ${totalPct}% (還差 ${diff}%)`;
          notice.className = 'text-xs font-medium text-rose-600';
          submitBtn.disabled = true;
          return false;
        } else {
          notice.textContent = '✅ 比例總和 100%';
          notice.className = 'text-xs font-medium text-emerald-600';
        }
      } else if (state.splitMode === 'items') {
        const preTaxTarget = totalAmt - taxAmt;
        if (preTaxTarget <= 0) {
          notice.textContent = '❌ 發票金額必須大於稅額';
          notice.className = 'text-xs font-medium text-rose-600';
          submitBtn.disabled = true;
          return false;
        }
        let itemsSum = 0, hasUnassigned = false;
        currentItems.forEach(item => {
          const p = parseFloat(item.price) || 0;
          itemsSum += p;
          if (p > 0 && (!item.assigned || item.assigned.length === 0)) hasUnassigned = true;
        });
        if (hasUnassigned) {
          notice.textContent = '⚠️ 有品項未指定承擔人';
          notice.className = 'text-xs font-medium text-amber-600';
          submitBtn.disabled = true;
          return false;
        }
        const diff = Math.round((preTaxTarget - itemsSum) * 100) / 100;
        if (Math.abs(diff) > 0.05) {
          notice.textContent = `❌ 品項未稅合計: ${itemsSum} (差額 ${diff > 0 ? '+' : ''}${diff})`;
          notice.className = 'text-xs font-medium text-rose-600';
          submitBtn.disabled = true;
          return false;
        } else {
          notice.textContent = `✅ 品項吻合稅前 ${preTaxTarget}`;
          notice.className = 'text-xs font-medium text-emerald-600';
        }
      }
      submitBtn.disabled = false;
      return true;
    }

    function saveExpense() {
      if (!validateSplits()) return;
      const descInput = document.getElementById('itemDesc');
      const desc = descInput ? (descInput.value.trim() || (state.splitMode === 'mahjong' ? '麻將結算' : '未命名開銷')) : '未命名開銷';
      const payer = document.getElementById('itemPayer')?.value || state.members[0];

      saveSnapshot();

      if (state.splitMode === 'mahjong') {
        const tableFee = mahjongState.tableFee || 0;
        const feeMode = mahjongState.feeSplitMode;
        let splits = {};
        state.members.forEach(m => {
          splits[m] = -(parseFloat(mahjongState.scores[m]) || 0);
        });
        if (tableFee > 0 && feeMode !== 'none') {
          if (feeMode === 'all') {
            const feePerPerson = Math.round((tableFee / state.members.length) * 100) / 100;
            state.members.forEach(m => { splits[m] = (splits[m] || 0) + feePerPerson; });
          } else if (feeMode === 'winner') {
            let maxWinner = '', maxScore = -Infinity;
            state.members.forEach(m => {
              const sc = parseFloat(mahjongState.scores[m]) || 0;
              if (sc > maxScore) { maxScore = sc; maxWinner = m; }
            });
            if (maxWinner) splits[maxWinner] = (splits[maxWinner] || 0) + tableFee;
          }
        }
        state.expenses.push({ id: Date.now(), desc, amount: tableFee, payer, mode: 'mahjong', splits });
        mahjongState.scores = {};
        mahjongState.tableFee = 0;
      } else {
        const total = parseFloat(document.getElementById('itemAmount')?.value) || 0;
        const tax = parseFloat(document.getElementById('itemTax')?.value) || 0;
        let splits = {};

        if (state.splitMode === 'equal') {
          const checked = Array.from(document.querySelectorAll('input[name="equalMember"]:checked')).map(el => el.value);
          const perPerson = Math.floor((total / checked.length) * 100) / 100;
          let running = 0;
          checked.forEach((m, idx) => {
            if (idx === checked.length - 1) splits[m] = Math.round((total - running) * 100) / 100;
            else { splits[m] = perPerson; running += perPerson; }
          });
        } else if (state.splitMode === 'percent') {
          const valid = state.members.filter(m => (parseFloat(percentShares[m]) || 0) > 0);
          let running = 0;
          valid.forEach((m, idx) => {
            if (idx === valid.length - 1) splits[m] = Math.round((total - running) * 100) / 100;
            else {
              const calc = Math.round(total * (parseFloat(percentShares[m]) / 100) * 100) / 100;
              splits[m] = calc; running += calc;
            }
          });
        } else if (state.splitMode === 'items') {
          const preTaxTotal = total - tax;
          const memberPreTax = {};
          state.members.forEach(m => memberPreTax[m] = 0);
          currentItems.forEach(item => {
            const p = parseFloat(item.price) || 0;
            if (p > 0 && item.assigned.length > 0) {
              const perAssignee = p / item.assigned.length;
              item.assigned.forEach(m => { memberPreTax[m] += perAssignee; });
            }
          });
          let runningTotal = 0;
          const memberKeys = Object.keys(memberPreTax).filter(m => memberPreTax[m] > 0);
          memberKeys.forEach((m, idx) => {
            if (idx === memberKeys.length - 1) splits[m] = Math.round((total - runningTotal) * 100) / 100;
            else {
              const ratio = memberPreTax[m] / preTaxTotal;
              const finalShare = Math.round((memberPreTax[m] + tax * ratio) * 100) / 100;
              splits[m] = finalShare; runningTotal += finalShare;
            }
          });
        }
        state.expenses.push({ id: Date.now(), desc, amount: total, payer, mode: state.splitMode, splits });
        if (descInput) descInput.value = '';
        const amtInput = document.getElementById('itemAmount'); if (amtInput) amtInput.value = '';
        const taxInput = document.getElementById('itemTax'); if (taxInput) taxInput.value = '';
      }
      renderAll();
    }

    function deleteExpense(id) {
      saveSnapshot();
      state.expenses = state.expenses.filter(e => e.id !== id);
      renderAll();
    }

    function computeSettlement() {
      const balances = {};
      state.members.forEach(m => balances[m] = 0);
      state.expenses.forEach(e => {
        if (e.amount > 0) balances[e.payer] = (balances[e.payer] || 0) + e.amount;
        if (e.splits) {
          Object.entries(e.splits).forEach(([person, share]) => {
            balances[person] = (balances[person] || 0) - share;
          });
        }
      });
      Object.keys(balances).forEach(m => { balances[m] = Math.round(balances[m] * 100) / 100; });
      const debtors = [], creditors = [];
      Object.entries(balances).forEach(([name, bal]) => {
        if (bal < -0.05) debtors.push({ name, amount: -bal });
        else if (bal > 0.05) creditors.push({ name, amount: bal });
      });
      debtors.sort((a, b) => b.amount - a.amount);
      creditors.sort((a, b) => b.amount - a.amount);

      const transactions = [];
      let i = 0, j = 0;
      while (i < debtors.length && j < creditors.length) {
        const amt = Math.min(debtors[i].amount, creditors[j].amount);
        if (amt > 0.01) {
          transactions.push({ from: debtors[i].name, to: creditors[j].name, amount: Math.round(amt * 100) / 100 });
        }
        debtors[i].amount -= amt; creditors[j].amount -= amt;
        if (debtors[i].amount <= 0.05) i++;
        if (creditors[j].amount <= 0.05) j++;
      }
      return { balances, transactions };
    }

    function renderAll() {
      renderMembers();
      renderPayerOptions();
      renderSplitConfig();
      renderExpenses();
      renderSettlement();
      updateUndoRedoButtons();
    }

    function renderMembers() {
      const container = document.getElementById('membersList');
      const countLabel = document.getElementById('memberCountLabel');
      if (countLabel) countLabel.textContent = `${state.members.length} 人`;
      if (!container) return;
      if (state.members.length === 0) {
        container.innerHTML = `<span class="text-xs text-slate-400 py-1">尚未加入夥伴，請在上方新增</span>`;
        return;
      }
      container.innerHTML = state.members.map(m => `
        <span class="inline-flex items-center gap-1.5 px-3 py-1 bg-slate-100 text-slate-700 rounded-full text-xs font-medium">
          ${m}
          <button onclick="removeMember('${m}')" class="text-slate-400 hover:text-rose-500 font-bold ml-0.5">&times;</button>
        </span>`).join('');
    }

    function renderPayerOptions() {
      const select = document.getElementById('itemPayer');
      if (!select) return;
      const prev = select.value;
      if (state.members.length === 0) {
        select.innerHTML = '<option value="">無成員</option>';
        return;
      }
      select.innerHTML = state.members.map(m => `<option value="${m}">${m}</option>`).join('');
      if (state.members.includes(prev)) select.value = prev;
    }

    function renderExpenses() {
      const tbody = document.getElementById('expenseTableBody');
      const countSpan = document.getElementById('expenseCount');
      const totalSpan = document.getElementById('totalExpenseAmount');
      if (countSpan) countSpan.textContent = state.expenses.length;
      if (totalSpan) totalSpan.textContent = state.expenses.reduce((acc, cur) => acc + (cur.amount || 0), 0).toLocaleString();
      if (!tbody) return;
      if (state.expenses.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-slate-400 text-xs">尚無任何支出記錄</td></tr>`;
        return;
      }
      const modeLabels = {
        equal: '<span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-indigo-50 text-indigo-600">平攤</span>',
        percent: '<span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-emerald-50 text-emerald-600">比例 %</span>',
        items: '<span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-amber-50 text-amber-600">品項+稅</span>',
        mahjong: '<span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-rose-50 text-rose-600">🀄 麻將</span>'
      };
      tbody.innerHTML = state.expenses.slice().reverse().map(e => {
        const details = e.splits ? Object.entries(e.splits).map(([person, share]) => `${person}: ${share}`).join(', ') : '';
        return `
          <tr class="hover:bg-slate-50 transition">
            <td class="p-3 font-medium text-slate-800">${e.desc}</td>
            <td class="p-3"><span class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 text-xs">${e.payer}</span></td>
            <td class="p-3 font-semibold text-slate-900">${e.amount.toLocaleString()}</td>
            <td class="p-3 text-xs text-slate-500"><div class="flex items-center gap-1.5 flex-wrap">${modeLabels[e.mode] || ''}<span class="truncate max-w-xs" title="${details}">${details}</span></div></td>
            <td class="p-3 text-right"><button onclick="deleteExpense(${e.id})" class="text-rose-500 hover:text-rose-700 text-xs font-medium">刪除</button></td>
          </tr>`;
      }).join('');
    }

    function renderSettlement() {
      const { balances, transactions } = computeSettlement();
      const netContainer = document.getElementById('netBalanceList');
      if (netContainer) {
        if (state.members.length === 0) {
          netContainer.innerHTML = `<div class="p-3 text-xs text-slate-400 text-center">無成員</div>`;
        } else {
          netContainer.innerHTML = Object.entries(balances).map(([name, bal]) => {
            const isPos = bal > 0.05, isZero = Math.abs(bal) <= 0.05;
            const color = isZero ? 'text-slate-400' : isPos ? 'text-emerald-600 font-semibold' : 'text-rose-600 font-semibold';
            const label = isZero ? '平帳 (0)' : isPos ? `應收 ${bal.toLocaleString()}` : `應付 ${Math.abs(bal).toLocaleString()}`;
            return `<div class="flex justify-between items-center text-sm py-1 border-b border-slate-100 last:border-none"><span class="text-slate-700 font-medium">${name}</span><span class="${color}">${label}</span></div>`;
          }).join('');
        }
      }
      const transferContainer = document.getElementById('transferInstructions');
      if (transferContainer) {
        if (transactions.length === 0) {
          transferContainer.innerHTML = `<div class="p-4 text-center text-emerald-600 text-xs font-medium">🎉 目前所有款項皆已平帳，不需要任何轉帳！</div>`;
        } else {
          transferContainer.innerHTML = transactions.map(t => `
            <div class="flex items-center justify-between p-3 bg-white rounded-xl border border-emerald-100 shadow-xs">
              <div class="flex items-center gap-2 text-sm font-medium text-slate-700"><span class="text-rose-600 font-bold">${t.from}</span><span class="text-slate-400">➡️</span><span class="text-emerald-600 font-bold">${t.to}</span></div>
              <span class="text-sm font-bold text-slate-900 bg-emerald-50 px-2.5 py-1 rounded-lg border border-emerald-200">${t.amount.toLocaleString()}</span>
            </div>`).join('');
        }
      }
    }

    function copySettlementReport() {
      const { balances, transactions } = computeSettlement();
      if (state.expenses.length === 0) return alert('目前無任何款項記錄可複製！');
      let text = `📢 【費用分攤達人 - 匯款方案】\n📅 結算時間：${new Date().toLocaleDateString()}\n💰 總花費：${state.expenses.reduce((a, b) => a + (b.amount || 0), 0).toLocaleString()}\n\n--- 📊 個人淨額 ---\n`;
      Object.entries(balances).forEach(([name, bal]) => {
        if (bal > 0.05) text += `• ${name}：應收 ${bal.toLocaleString()}\n`;
        else if (bal < -0.05) text += `• ${name}：應付 ${Math.abs(bal).toLocaleString()}\n`;
        else text += `• ${name}：平帳 (0)\n`;
      });
      text += `\n--- 🚀 匯款方案 ---\n`;
      if (transactions.length === 0) text += `完全平帳，大家都不用轉帳！🥳\n`;
      else transactions.forEach(t => { text += `👉 ${t.from} 轉給 ${t.to}：${t.amount.toLocaleString()}\n`; });

      const fallback = (str) => {
        const ta = document.createElement("textarea"); ta.value = str; ta.style.position = "fixed"; ta.style.left = "-9999px";
        document.body.appendChild(ta); ta.focus(); ta.select();
        try { document.execCommand('copy'); alert('✅ 結算結果已成功複製！'); } catch(e) { alert('複製失敗'); }
        document.body.removeChild(ta);
      };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => alert('✅ 結算結果已成功複製！')).catch(() => fallback(text));
      } else fallback(text);
    }

    function clearAllData() {
      if (!confirm('確定要清空所有資料嗎？此動作可透過「復原」按鈕回復。')) return;
      saveSnapshot();
      state = { members: [], splitMode: 'equal', expenses: [] };
      percentShares = {};
      mahjongState = { tableFee: 0, feeSplitMode: 'all', scores: {} };
      currentItems = [{ id: 1, name: '餐點 A', price: '', assigned: [] }];
      renderAll();
    }

    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
        e.preventDefault();
        if (e.shiftKey) redo(); else undo();
      } else if ((e.ctrlKey || e.metaKey) && e.key === 'y') {
        e.preventDefault();
        redo();
      }
    });

    loadSavedState();
  </script>
</body>
